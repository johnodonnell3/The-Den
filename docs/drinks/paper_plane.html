<body>

<h1 class="drink-title">Paper Plane</h1>

<img class="drink-photo" src="../images/paper_plane.jpg">

<h2>Ingredients</h2>
<ul class="ingredients">
    <li>3/4 oz bourbon</li>
    <li>3/4 oz Aperol</li>
    <li>3/4 oz Amaro Nonino</li>
    <li>3/4 oz Fresh Lemon Juice</li>
</ul>

<h2>Instructions</h2>
<ol class="instructions">
    <li>Add ingredients to mixing glass with ice.</li>
    <li>Shake until chilled.</li>
    <li>Strain into coupe glass.</li>
    <li>Garnish with lemon twist.</li>
</ol>
